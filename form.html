<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUXORA Premium</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="form.css">

</head>
<body>

<!-- HEADER -->
<header class="topbar">
<a href="index.html" class="back">←</a>
<h2>LUXORA</h2>
</header>

<!-- CONTENT -->
<div class="wrapper">

<!-- HOTEL -->
<div class="hotel">
<img id="hotelImage">

<div class="overlay"></div>

<div class="hotel-text">
<h1 id="hotelName">Villa Bandung</h1>
<p id="hotelLocation">📍 Bandung</p>
</div>
</div>

<!-- FORM -->
<div class="card">

<h3>Reservation</h3>

<div class="form">

<input type="text" placeholder="Nama lengkap">

<div class="row">
<input type="number" placeholder="Nomor HP">
<input type="number" placeholder="Tamu">
</div>

<div class="row">
<input type="date">
<input type="date">
</div>

<input type="email" placeholder="Email">

<textarea placeholder="Permintaan tambahan"></textarea>

</div>

<!-- PRICE -->
<div class="price">
<div>
<span>Total</span>
<h2 id="hotelPrice">Rp0</h2>
</div>

<b id="hotelDiscount">50% OFF</b>
</div>

</div>

</div>

<!-- BUTTON -->
<button class="btn" onclick="submitForm()">
Konfirmasi
</button>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="box">

<div class="icon">✓</div>

<h3>Berhasil</h3>
<p>Reservasi dikirim</p>

<button onclick="closePopup()">OK</button>

</div>
</div>

<script src="form.js"></script>

</body>
</html>
