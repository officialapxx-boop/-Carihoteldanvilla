<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Booking</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<!-- INFO HOTEL -->
<div class="hotel-box">

<img id="hotelImage">

<h2 id="hotelName"></h2>
<p id="hotelLocation"></p>

<div id="hotelPrice"></div>

<div id="facilities"></div>

</div>

<!-- FORM -->
<div class="form-box">

<!-- STEP 1 -->
<div class="step active">

<h3>Data Diri</h3>

<input type="text" placeholder="Nama lengkap" required>

<input type="tel"
inputmode="numeric"
pattern="[0-9]*"
placeholder="Nomor HP"
required>

<input type="email"
placeholder="Email"
required>

<button onclick="next()">Lanjut</button>

</div>

<!-- STEP 2 -->
<div class="step">

<h3>Tanggal Booking</h3>

<label>Check-in</label>
<input type="date" required>

<label>Check-out</label>
<input type="date" required>

<div class="total-box">
Total Harga:
<strong id="totalHarga">-</strong>
</div>

<button onclick="prev()">Kembali</button>
<button onclick="next()">Lanjut</button>

</div>

<!-- STEP 3 -->
<div class="step">

<h3>Detail Tambahan</h3>

<input type="number"
inputmode="numeric"
placeholder="Jumlah tamu"
min="1"
required>

<textarea placeholder="Permintaan tambahan"></textarea>

<button onclick="prev()">Kembali</button>
<button onclick="submitForm()">Kirim</button>

</div>

</div>

</div>

<script src="form.js"></script>

</body>
</html>
