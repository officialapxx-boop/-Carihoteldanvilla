<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXORA PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
<a href="index.html" class="back">←</a>

<div class="brand">
<img src="https://cdn-icons-png.flaticon.com/512/190/190411.png">
<span>LUXORA</span>
</div>
</header>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="container">

<div class="hotel">
<img id="hotelImage">
<div class="overlay"></div>
<h3 id="hotelName">Villa</h3>
</div>

<!-- STEP 1 -->
<div class="step active">
<h3>Data Diri</h3>

<input placeholder="Nama lengkap">
<input placeholder="Nomor HP">
<input placeholder="Email">

<button onclick="next()">Lanjut</button>
</div>

<!-- STEP 2 -->
<div class="step">
<h3>Detail Booking</h3>

<div class="row">
<input type="date">
<input type="date">
</div>

<input placeholder="Jumlah tamu">
<textarea placeholder="Permintaan tambahan"></textarea>

<div class="nav">
<button onclick="prev()">Kembali</button>
<button onclick="next()">Lanjut</button>
</div>
</div>

<!-- STEP 3 -->
<div class="step">
<h3>Konfirmasi</h3>

<div class="price">
<h2 id="hotelPrice">Rp0</h2>
<span id="hotelDiscount">50% OFF</span>
</div>

<button onclick="submitForm()">Konfirmasi Reservasi</button>
</div>

</div>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="box">
<div class="icon">✓</div>
<h3>Berhasil</h3>
<p>Reservasi dikirim</p>
<button onclick="closePopup()">OK</button>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
