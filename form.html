<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Hotel</title>

<link rel="stylesheet" href="form.css">
</head>
<body>

<div class="container">

<!-- HOTEL -->
<div class="hotel-box">

<img id="hotelImage">

<div class="hotel-info">

<div class="hotel-header">
<div class="hotel-name" id="hotelName"></div>
<div class="rating">4.5 ⭐</div>
</div>

<div class="location" id="hotelLocation"></div>

<div class="hotel-footer">
<div class="price" id="hotelPrice"></div>
</div>

</div>

<div id="facilities"></div>

</div>

<!-- FORM -->
<div class="form-box">

<div class="step active">
<h3>Data Diri</h3>

<input type="text" id="nama" placeholder="Nama lengkap" required>
<input type="tel" id="hp" placeholder="Nomor HP" required>
<input type="email" id="email" placeholder="Email" required>

<button onclick="next()">Lanjut</button>
</div>

<div class="step">
<h3>Tanggal Booking</h3>

<input type="date" id="checkin">
<input type="date" id="checkout">

<div class="total-box">
<strong id="totalHarga">-</strong>
</div>

<div class="nav">
<button onclick="prev()">Kembali</button>
<button onclick="next()">Lanjut</button>
</div>
</div>

<div class="step">
<h3>Detail</h3>

<input type="number" id="tamu" placeholder="Jumlah tamu" min="1">
<textarea id="req"></textarea>

<div class="nav">
<button onclick="prev()">Kembali</button>
<button onclick="submitForm()">Kirim</button>
</div>
</div>

</div>
</div>

<script src="form.js"></script>
</body>
</html>
