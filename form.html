<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Booking</title>

<link rel="stylesheet" href="form.css">

</head>
<body>

<div class="container">

<!-- HOTEL -->
<div class="hotel">
<img src="https://picsum.photos/500/300" id="hotelImage">

<div class="overlay"></div>

<div class="hotelText">
  <h2>Gua Villa Bandung</h2>
  <p>Bandung, Indonesia</p>
  <div>Rp1.300.000</div>
  <div class="info">Infinity Pool • Balkon • WiFi • Breakfast</div>
</div>
</div>

<!-- STEP 1 -->
<div class="step active">
<h3>Data Diri</h3>

<input type="text" placeholder="Nama lengkap">
<input type="tel" placeholder="Nomor HP">
<input type="email" placeholder="Email">

<button onclick="next()">Lanjut</button>
</div>

<!-- STEP 2 -->
<div class="step">
<h3>Tanggal Booking</h3>

<label>Check-in</label>
<input type="date" id="in">

<label>Check-out</label>
<input type="date" id="out">

<div class="price">
Total Harga:
<strong id="total">-</strong>
</div>

<div class="row">
<button onclick="prev()">Kembali</button>
<button onclick="next()">Lanjut</button>
</div>
</div>

<!-- STEP 3 -->
<div class="step">
<h3>Detail Tambahan</h3>

<input type="number" placeholder="Jumlah tamu" min="1">
<textarea placeholder="Permintaan tambahan"></textarea>

<div class="row">
<button onclick="prev()">Kembali</button>
<button onclick="submitForm()">Kirim</button>
</div>
</div>

</div>

<script src="form.js"></script>

</body>
</html>
