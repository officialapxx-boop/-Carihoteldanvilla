<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXORA | Reservation</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="form.css">

</head>
<body>

<!-- HEADER MINI -->
<header class="topbar">
<a href="index.html" class="back-btn">←</a>

<div class="brand">
<img src="assets/logo.png">
<span>LUXORA</span>
</div>
</header>

<!-- CARD -->
<div class="container">

<!-- HOTEL -->
<div class="hotel-card">
<img id="hotelImage">

<div class="hotel-info">
<h2 id="hotelName">Villa Bandung</h2>
<p id="hotelLocation">📍 Bandung</p>
</div>
</div>

<!-- FORM -->
<div class="form-box">

<h3>Reservation</h3>

<div class="form">

<input type="text" placeholder="Nama lengkap">

<div class="row">
<input type="number" placeholder="Nomor HP">
<input type="number" placeholder="Tamu">
</div>

<div class="row">
<input type="date">
<input type="date">
</div>

<input type="email" placeholder="Email">

<textarea placeholder="Permintaan tambahan"></textarea>

</div>

<!-- PRICE -->
<div class="price-box">
<div>
<small>Total</small>
<h2 id="hotelPrice">Rp0</h2>
</div>

<span id="hotelDiscount">50% OFF</span>
</div>

</div>

</div>

<!-- BUTTON STICKY -->
<button class="cta" onclick="submitForm()">
Konfirmasi Reservasi
</button>

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-box">

<div class="check">✓</div>

<h3>Berhasil</h3>
<p>Reservasi berhasil dikirim</p>

<button onclick="closePopup()">Selesai</button>

</div>
</div>

<script src="form.js"></script>

</body>
</html>
